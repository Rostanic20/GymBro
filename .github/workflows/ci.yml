name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: gradle/actions/wrapper-validation@v6.2.0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v6.2.0

      - name: Lint
        run: ./gradlew :app:lintDebug

      # verifyDebugAppDbMigration lives under check, which testDebugUnitTest does not pull in.
      - name: Unit tests and migration check
        run: ./gradlew :app:testDebugUnitTest :app:verifyDebugAppDbMigration

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            app/build/reports/**
            app/build/test-results/**
          if-no-files-found: ignore
